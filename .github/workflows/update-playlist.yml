name: Update Playlist

on:
  schedule:
    # Every 6 hours at minute 0 (UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:   # allow manual "Run workflow" button
  push:
    branches: [main]
    paths:
      - 'fetch_and_combine.py'
      - '.github/workflows/update-playlist.yml'

# Only one run at a time; do NOT cancel mid-run (would corrupt the playlist)
concurrency:
  group: update-playlist
  cancel-in-progress: false

# The default GITHUB_TOKEN needs write access to push the updated playlist
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # hard cap — well under GitHub's 6-hour job limit

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir requests urllib3

      - name: Run fetch_and_combine.py
        run: python fetch_and_combine.py

      - name: Show generated files
        run: |
          echo "--- master_playlist.m3u (first 40 lines) ---"
          head -n 40 master_playlist.m3u || true
          echo "--- stats.json ---"
          cat stats.json || true

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add master_playlist.m3u stats.json
          if git diff --cached --quiet; then
            echo "No changes since last run — nothing to commit."
          else
            TIMESTAMP="$(date -u '+%Y-%m-%d %H:%M UTC')"
            git commit -m "chore: auto-update playlist ${TIMESTAMP}"
            git push
            echo "Pushed update at ${TIMESTAMP}"
          fi
